              - paragraph [ref=e83]: Which head, which shaft, and is it the one already in my bag?
              - paragraph [ref=e84]: Driver through wedge on the monitor. Shaft first, head second, because the shaft decides more of it than anybody expects. We stop when two clubs are left and you choose between them by feel.
