    - generic [ref=e165]:
      - generic [ref=e166]:
        - text: How a session runs
        - heading "Ninety minutes, in four parts" [level=2] [ref=e167]
        - paragraph [ref=e168]: The same order every time, whatever the session. The shorter ones skip nothing, they simply cover fewer clubs.
      - list [ref=e169]:
        - listitem [ref=e170]:
          - text: "01"
          - heading "You talk first" [level=3] [ref=e171]
          - paragraph [ref=e172]: Ten minutes on what you play, where you play it and which shot has gone missing. No clubs in hand yet.
        - listitem [ref=e173]:
          - text: "02"
          - heading "Your own club, on the monitor" [level=3] [ref=e174]
          - paragraph [ref=e175]: You hit what is in your bag before you hit anything of ours, so every number after it has something to be measured against.
        - listitem [ref=e176]:
          - text: "03"
          - heading "Down to two" [level=3] [ref=e177]
          - paragraph [ref=e178]: The wall narrows quickly, then the rest of the hour goes on the shortlist. A fitting that ends with six options has not ended.
        - listitem [ref=e179]:
          - text: "04"
          - heading "Written down, ordered or not" [level=3] [ref=e180]
          - paragraph [ref=e181]: Your specs go on paper whether you buy or not. Nothing is ordered in the room. Go home and think about it.
